name: Build Relay.app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Universal Relay.app (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust targets (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust unit tests
        working-directory: core
        run: cargo test --all-targets

      - name: Build Universal Relay.app (arm64 + x86_64)
        run: ./app/build_app.sh --universal

      - name: Verify Universal binaries
        run: |
          file app/Relay.app/Contents/MacOS/Relay
          file app/Relay.app/Contents/Resources/relay-daemon
          file app/Relay.app/Contents/Resources/RelayBridge
          file app/Relay.app/Contents/PlugIns/RelayFileProvider.appex/Contents/MacOS/RelayFileProvider
          codesign --verify --deep --strict app/Relay.app

      - name: Package Relay.app
        run: |
          ditto -c -k --sequesterRsrc --keepParent app/Relay.app Relay-macos-universal.zip

      - name: Upload Relay.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relay-macos-universal
          path: Relay-macos-universal.zip
          retention-days: 30

      - name: Attach to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Relay-macos-universal.zip
